# Keeps skills/gagarin/SKILL.md byte-identical to skill/SKILL.md at gg's latest
# release, and moves the plugin version so Claude Code re-installs it.
#
# Pull, not push. A push from gg's release workflow would need a cross-repo PAT
# or App — a third long-lived secret, living in the repo with the most
# contributor traffic — and would make gg's releases fail when this repo is
# misconfigured. A cron is also self-healing where a missed dispatch would leave
# drift forever. Latency does not matter here: this is documentation, and
# workflow_dispatch is the zero-lag path when it does.
name: sync-skill

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      gg_ref:
        description: "gg tag to vendor (default: latest release)"
        required: false
        type: string
  repository_dispatch:
    # Unwired on purpose: gg can add one `gh api` step later and nothing here
    # needs to change.
    types: [gg-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve target gg tag
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.gg_ref }}
          DISPATCH_REF: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-${DISPATCH_REF:-}}"
          if [ -z "$ref" ]; then
            ref=$(gh release view --repo gagarin-cloud/gg --json tagName -q .tagName)
          fi
          # Only ever vendor from a tag: a branch would make the pin a lie.
          case "$ref" in
            v*) ;;
            *) echo "refusing to vendor from a non-tag ref: $ref" >&2; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "current=$(jq -r .ref skills/gagarin/SOURCE.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch SKILL.md at that tag
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          gh api "repos/gagarin-cloud/gg/contents/skill/SKILL.md?ref=$REF" \
            -H "Accept: application/vnd.github.raw" > /tmp/SKILL.md
          # A 404 body is still a file. Assert the shape before vendoring it,
          # because the frontmatter is what makes Claude Code load the skill.
          head -1 /tmp/SKILL.md | grep -qx -- '---'
          grep -qE '^name: gagarin$' /tmp/SKILL.md
          grep -qE '^description: .{40,}' /tmp/SKILL.md
          test "$(wc -l < /tmp/SKILL.md)" -ge 500
          echo "sha256=$(sha256sum /tmp/SKILL.md | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Apply
        id: apply
        env:
          REF: ${{ steps.target.outputs.ref }}
          SHA256: ${{ steps.fetch.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -m 644 /tmp/SKILL.md skills/gagarin/SKILL.md
          jq --arg ref "$REF" --arg sha "$SHA256" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.ref = $ref | .sha256 = $sha | .vendored_at = $at' \
            skills/gagarin/SOURCE.json > /tmp/SOURCE.json
          mv /tmp/SOURCE.json skills/gagarin/SOURCE.json

          # If only vendored_at moved, the skill is unchanged and there is
          # nothing worth releasing.
          if git diff --quiet -- skills/gagarin/SKILL.md; then
            git checkout -- skills/gagarin/SOURCE.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/bump-version.sh --gg "$REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.apply.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/gg-${{ steps.target.outputs.ref }}
          base: main
          commit-message: "Vendor the skill from gg ${{ steps.target.outputs.ref }}"
          title: "Vendor the skill from gg ${{ steps.target.outputs.ref }} (plugin ${{ steps.apply.outputs.version }})"
          body: |
            Vendored `skill/SKILL.md` from gagarin-cloud/gg at
            **${{ steps.target.outputs.ref }}** — was ${{ steps.target.outputs.current }}.

            - sha256 `${{ steps.fetch.outputs.sha256 }}`
            - plugin version → `${{ steps.apply.outputs.version }}`

            Opened by `.github/workflows/sync-skill.yml`. Read the SKILL.md diff
            for anything that now contradicts this plugin's own commands or
            agents — a renamed `gg` command is the case worth catching — then
            merge. Merging ships the new version to everyone who has it
            installed.
          labels: automated, skill-sync
          delete-branch: true
