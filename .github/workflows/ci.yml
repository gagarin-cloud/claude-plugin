name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The skill can go stale without anyone touching this repository: gg is
    # where the commands change. Catch that within a day rather than on the
    # next edit here.
    - cron: "23 6 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Manifests and skill frontmatter
        run: ./scripts/check.sh

  agrees-with-gg:
    # The skill used to live inside the gg binary, which guaranteed the two
    # shipped together and nothing more. This checks that they agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install the latest released gg
        run: |
          set -euo pipefail
          go install github.com/gagarin-cloud/gg@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Every gg command the skill names is a real one
        run: |
          gg version
          ./scripts/check-skill-against-gg.sh
