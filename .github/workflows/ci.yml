name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The skill can go stale without anyone touching this repository: gg is
    # where the commands change. Catch that within a day rather than on the
    # next edit here.
    - cron: "23 6 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Manifests and skill frontmatter
        run: ./scripts/check.sh

  agrees-with-gg:
    # The skill used to live inside the gg binary, which guaranteed the two
    # shipped together and nothing more. This checks that they agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # A pull request whose gg half is still a pull request — a new command
      # documented here while it waits for review there — is checked against
      # gg's branch of the same name, because the release does not have the
      # command yet and failing on that says nothing about whether the two
      # halves agree. Pushes to main and the daily run always check the
      # release, so a skill merged ahead of its gg release still goes red on
      # main until gg ships it. The branch is resolved to a commit because Go
      # refuses a branch name with a slash in it as a version.
      - name: Install gg — the paired branch on a pull request, else the latest release
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          ref=latest
          if [ -n "${BRANCH}" ]; then
            sha=$(git ls-remote https://github.com/gagarin-cloud/gg "refs/heads/${BRANCH}" | cut -f1)
            if [ -n "${sha}" ]; then
              ref="${sha}"
              echo "::notice::checking against gg's ${BRANCH} branch (${sha}), not a release"
            fi
          fi
          go install "github.com/gagarin-cloud/gg@${ref}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Every gg command the skill names is a real one
        run: |
          gg version
          ./scripts/check-skill-against-gg.sh
